<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Muhammad Kamran</title>
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="robots" content="noindex" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background-color: #0a0e1a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        overflow-x: hidden;
      }

      .container {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }

      .error-code {
        font-size: clamp(8rem, 14rem, 14rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(to bottom, #ffffff, rgba(255, 255, 255, 0.1));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        user-select: none;
        margin-bottom: 1rem;
      }

      .divider {
        width: 5rem;
        height: 2px;
        background: #6366f1;
        border-radius: 1px;
        margin: 0 auto 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }

      p {
        color: #94a3b8;
        font-size: 0.9375rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        font-family: inherit;
      }

      .btn-secondary {
        background: rgba(19, 24, 41, 0.5);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
      }

      .btn-secondary:hover {
        background: rgba(26, 32, 53, 0.8);
        border-color: rgba(99, 102, 241, 0.3);
      }

      .btn-primary {
        background: #ffffff;
        color: #0a0e1a;
      }

      .btn-primary:hover {
        transform: scale(1.05);
      }

      .terminal {
        margin-top: 2.5rem;
        padding: 1rem 1.25rem;
        background: rgba(19, 24, 41, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        backdrop-filter: blur(12px);
        font-family: "JetBrains Mono", "Geist Mono", monospace;
        font-size: 0.75rem;
        text-align: left;
        max-width: 28rem;
        margin-left: auto;
        margin-right: auto;
      }

      .terminal-header {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 50%;
      }

      .dot-red { background: #ef4444; }
      .dot-yellow { background: #eab308; }
      .dot-green { background: #22c55e; }

      .terminal-line {
        color: #94a3b8;
        margin-bottom: 0.25rem;
      }

      .terminal-accent { color: #6366f1; }
      .terminal-error { color: #f87171; }
      .terminal-dim { color: #64748b; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>
      <div class="divider"></div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

      <div class="actions">
        <button class="btn btn-secondary" onclick="history.back()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go Back
        </button>
        <a href="/" class="btn btn-primary">Home</a>
      </div>

      <div class="terminal">
        <div class="terminal-header">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <div class="terminal-line">
          <span class="terminal-accent">root@kami-os</span><span class="terminal-dim">:</span><span class="terminal-dim">~</span><span class="terminal-dim">$</span> navigate --to requested_page
        </div>
        <div class="terminal-line terminal-error">Error: PATH_NOT_FOUND — This route does not exist in the system.</div>
      </div>
    </div>
  </body>
</html>
