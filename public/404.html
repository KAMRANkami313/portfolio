<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Muhammad Kamran</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #fff;
      font-family: "Geist", "Inter", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container { text-align: center; max-width: 32rem; }
    .code {
      font-size: clamp(8rem, 14rem, 14rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0.6) 40%, rgba(255,255,255,0.1) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }
    .line { width: 5rem; height: 2px; background: #6366f1; margin: 0 auto 2rem; border-radius: 999px; }
    h2 { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 1rem; }
    p { color: rgba(255,255,255,0.5); font-size: 1rem; line-height: 1.7; margin-bottom: 2.5rem; }
    .buttons { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.875rem 1.5rem; background: rgba(10,10,10,0.5);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem;
      color: #fff; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; font-size: 0.875rem; cursor: pointer;
      text-decoration: none; transition: all 0.2s;
      backdrop-filter: blur(12px);
    }
    .btn-back:hover { background: rgba(255,255,255,0.05); border-color: rgba(99,102,241,0.3); }
    .btn-home {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.875rem 1.5rem; background: #fff; color: #000;
      border: none; border-radius: 1rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.875rem;
      cursor: pointer; text-decoration: none; transition: transform 0.2s;
    }
    .btn-home:hover { transform: scale(1.05); }
    .terminal {
      margin-top: 3rem; padding: 1rem 1.5rem;
      background: rgba(10,10,10,0.4); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 0.75rem; text-align: left;
      backdrop-filter: blur(12px);
    }
    .dots { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .dots span { width: 0.5rem; height: 0.5rem; border-radius: 50%; }
    .dot-r { background: #ef4444; }
    .dot-y { background: #eab308; }
    .dot-g { background: #22c55e; }
    .terminal p { font-family: "Geist Mono", "Fira Code", monospace; font-size: 0.75rem; margin-bottom: 0.25rem; }
    .terminal .accent { color: #6366f1; }
    .terminal .blue { color: #60a5fa; }
    .terminal .dim { color: rgba(255,255,255,0.3); }
    .terminal .red { color: #f87171; }
    svg { width: 1.125rem; height: 1.125rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="line"></div>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="buttons">
      <button class="btn-back" onclick="history.back()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Go Back
      </button>
      <a href="/" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
    </div>
    <div class="terminal">
      <div class="dots">
        <span class="dot-r"></span>
        <span class="dot-y"></span>
        <span class="dot-g"></span>
      </div>
      <p><span class="accent">root@kami-os</span><span class="dim">:</span><span class="blue">~</span><span class="dim">$</span> navigate --to requested_page</p>
      <p class="red">Error: PATH_NOT_FOUND — This route does not exist in the system.</p>
    </div>
  </div>
</body>
</html>
